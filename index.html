  <!--
    Audio-Dateien der Winkekatze:
    - audio_1.mp3: Erste Sprachnachricht nach dem Öffnen des Vorhangs
    - audio_2.mp3: Zweite Sprachnachricht, sobald alle 3 Laternen-Stufen eingeschaltet sind
    - audio_3.mp3: Dritte Sprachnachricht (Memory-Erklärung), nachdem die Katze zwischen den Karten hervorgelugt hat
    - audio_4.mp3: Vierte Sprachnachricht (Lob nach dem Memory, vor dem Niesen)
    - hatschi.mp3 (Niesen), knall.mp3, richtig.mp3, falsch.mp3: Soundeffekte (werden über Web Audio geladen)
  -->
  <audio id="catAudio1" src="audio_1.mp3" preload="auto" playsinline></audio>
  <audio id="catAudio2" src="audio_2.mp3" preload="auto" playsinline></audio>
  <audio id="catAudio3" src="audio_3.mp3" preload="auto" playsinline></audio>
  <audio id="catAudio4" src="audio_4.mp3" preload="auto" playsinline></audio>

  <script>
    const stage = document.getElementById('stage');
    const button = document.getElementById('startButton');
    const volumeHint = document.getElementById('volumeHint');
    const curtainContainer = document.getElementById('curtainContainer');
    const invitationStage = document.getElementById('invitationStage');
    const lanternLayer = document.getElementById('lanternLayer');
    const speechStack = document.getElementById('speechStack');
    const speechBubble1 = document.getElementById('speechBubble1');
    const speechBubble2 = document.getElementById('speechBubble2');
    const manekiWrap = document.getElementById('manekiWrap');
    const manekiCanvas = document.getElementById('manekiCanvas');
    const memoryBoard = document.getElementById('memoryBoard');
    const catAudio1 = document.getElementById('catAudio1');
    const catAudio2 = document.getElementById('catAudio2');
    const catAudio3 = document.getElementById('catAudio3');
    const catAudio4 = document.getElementById('catAudio4');

    // Konfiguration für Winkekatze:
    // Ist winkekatze.gif vorhanden, wird direkt das GIF genutzt,
    // andernfalls wird winkekatze.jpg automatisch freigestellt und mit animiertem Wink-Arm gerendert.
    const MANEKI_CONFIG = {
      gifSrc: 'winkekatze.gif',
      jpgSrc: 'winkekatze.jpg'
    };

    // Texte für Phase 1 (vor dem Einschalten aller Laternen)
    const PHASE1_PART1_TEXT = 'Hey Du da! Hier unten bin ich. Ich sehe Dich gar nicht. Kannst Du vielleicht mal kurz die Laternen anknipsen?';
    const PHASE1_PART2_TEXT = 'Wie, Du weißt nicht, wie das geht? Versuch doch mal auf ein paar Laternen zu klicken.';

    // Texte für Phase 2 (nachdem alle 3 Laternen-Stufen eingeschaltet sind)
    const PHASE2_PART1_TEXT = 'Ja super. Geht doch. Ein besonderer Geburtstag steht an und ich weiß, Du dachtest wahrscheinlich, Du bekommst \'ne Einladung und das war\'s, aber warum so einfach, wenn es auch etwas spannender geht?';
    const PHASE2_PART2_TEXT = 'Beweis mir doch erstmal, dass Du das Geburtstagskind auch richtig gut kennst. Wenn Du dabei bist, streichel mich einmal, dann weiß ich Bescheid.';

    // Zeitpunkte in Sekunden für Phase 1 (inkl. 1s Verzögerung nach Vorhang-Öffnung & 1s Pause dazwischen)
    const PHASE1_TIMELINE = {
      startDelay: 1.0,
      part1Start: 1.0,
      part1End: 6.2,
      part2Start: 7.2,
      part2End: 12.4
    };

    // Zeitpunkte in Sekunden für Phase 2
    const PHASE2_TIMELINE = {
      startDelay: 1.5,
      part1Start: 0.0,
      part1DefaultDuration: 12.5,
      pauseBetweenParts: 1.0,
      part2DefaultDuration: 10.5
    };

    // Memory-Spielfeld: Platzhalter-Jahreszahlen (Jahreszahl Nr. n gehört zu bild<n>.jpg)
    const MEMORY_YEARS = ['1968', '1975', '1984', '1992', '2001', '2010'];
    const MEMORY_IMAGE_COUNT = 6;
    // Pärchen: Jahreszahlen werden aufsteigend sortiert, die kleinste gehört zu bild1.jpg, die größte zu bild6.jpg
    const MEMORY_YEARS_SORTED = MEMORY_YEARS.slice().sort((x, y) => Number(x) - Number(y));
    const MEMORY_PAIR_COUNT = 6;

    // Fall-Animation
    const MEMORY_FALL_MIN_MS = 700;             // Fallzeit einer Karte (kurzer Weg)
    const MEMORY_FALL_MAX_MS = 1050;            // Fallzeit einer Karte (langer Weg)
    const MEMORY_PAUSE_BETWEEN_MS = 180;        // Pause zwischen Landung und Start der nächsten Karte
    const KNALL_POOL_SIZE = 4;                  // Notlösung ohne Web Audio: Anzahl paralleler Audio-Instanzen

    // Katzen-Auftritt nach der letzten Landung
    const MEMORY_POST_KNALL_PAUSE_MS = 1000;    // Pause NACH Landung + verklungenem knall.mp3 (mindestens 1 Sekunde)
    const MEMORY_PEEK_GAP_PX = 6;               // Abstand im Raster (wie --g im CSS)

    // Memory-Ansage (audio_3.mp3), alles in einer einzigen Sprechblase.
    // Hinweis: Anreden (Du, Dich, Dir, Dein, Deine, Euch, Euer) immer großschreiben, falls der Text einmal angepasst wird.
    const MEMORY_INTRO_TEXT = "Auf geht's. Wir spielen eine Runde Memory gemeinsam. Oben sind Fotos, unten sind Jahreszahlen. Immer ein Foto und eine Jahreszahl gehören zusammen. Decke nacheinander die Memory Karten auf und finde alle Pärchen.";
    const MEMORY_HINT_TOP_PHRASE = 'Oben sind Fotos';
    const MEMORY_HINT_BOTTOM_PHRASE = 'unten sind Jahreszahlen';
    const MEMORY_INTRO_FALLBACK_DURATION_S = 16;   // Textdauer, falls audio_3.mp3 nicht abgespielt werden kann
    const MEMORY_INTRO_TEXT_END_RATIO = 0.95;      // Text ist bei 95 % der Audiolänge vollständig (kleiner = Text früher fertig)
    const MEMORY_INTRO_HOLD_MS = 1200;             // So lange bleibt die fertige Sprechblase nach dem Audio stehen

    // Spiellogik
    const MEMORY_FLIP_MS = 700;                    // Dauer der Umdreh-Animation (wie im CSS)
    const MEMORY_EVAL_DELAY_MS = 750;              // Wartezeit nach dem Aufdecken der 2. Karte bis zur Auswertung
    const MEMORY_WRONG_SHOW_MS = 900;              // So lange bleiben falsche Karten offen, bevor sie zurückdrehen

    // Finale: Karten fallen weg, Katze niest, roter Umschlag fliegt in einer Spirale heran und öffnet sich
    const FINALE_START_DELAY_MS = 900;             // Pause nach dem letzten Treffer
    const FINALE_CARD_FALL_MS = 480;               // Fallzeit einer Karte beim Wegfallen (deutlich schneller als beim Hereinfallen)
    const FINALE_CARD_STAGGER_MS = 55;             // Versatz zwischen den Karten (unterste Reihe zuerst)
    const FINALE_BEFORE_AUDIO4_MS = 1000;          // Pause (mindestens 1 s) nach dem Wegfallen der Karten, bevor audio_4.mp3 startet
    const FINALE_SPEECH_TEXT = "Yippie, das hast Du toll gemacht! Schau mal, ich habe etwas für Dich!";   // Anreden immer großschreiben (Du, Dich, ...)
    const FINALE_SPEECH_FALLBACK_S = 6;            // Textdauer, falls audio_4.mp3 nicht abgespielt werden kann
    const FINALE_SPEECH_HOLD_MS = 800;             // So lange bleibt die fertige Sprechblase nach dem Ende von audio_4.mp3 stehen
    const FINALE_AFTER_AUDIO4_MS = 1000;           // Pause (mindestens 1 s) nach der Sprechblase, dann niest die Katze
    const HATSCHI_SNEEZE_OVERRIDE_S = null;        // Zahl = fester Zeitpunkt des Niesens in hatschi.mp3 (Sekunden); null = automatisch (lautester Moment)
    const HATSCHI_FALLBACK_SNEEZE_MS = 600;        // Zeitpunkt des Niesens, falls die Datei nicht analysiert werden kann

    const ENVELOPE_ASPECT = 704 / 1477;            // Seitenverhältnis von brief.jpg (Höhe / Breite)
    const ENVELOPE_WIDTH_RATIO = 0.94;             // Endbreite des Umschlags (94 % der Bildschirmbreite)
    const ENVELOPE_BOTTOM_RATIO = 0.04;            // Abstand des Umschlags zum unteren Rand (Anteil der Bildschirmhöhe)
    const ENVELOPE_START_SCALE = 0.07;             // Startgröße (sehr klein)
    const ENVELOPE_START_X = -0.14;                // Startpunkt relativ zur Katze: leicht links ...
    const ENVELOPE_START_Y = 0.50;                 // ... und unterhalb der Gesichtsmitte (Anteil der Katzenhöhe)
    const ENVELOPE_SPIRAL_MS = 7000;               // Dauer der drei Runden (vorher 3800 ms, jetzt ca. 1,85-fach: ruhiger und edler)
    const ENVELOPE_LAPS = 3;                       // Anzahl voller Kreise (gegen den Uhrzeigersinn)
    const ENVELOPE_OPEN_DELAY_MS = 700;            // Pause nach der Landung, dann klappt die Lasche auf
    const ENVELOPE_FLAP_MS = 1200;                 // Dauer des Aufklappens
    const ENVELOPE_PAPER_MS = 1900;                // Dauer des Herausgleitens des Papiers
    const PAPER_END_BOTTOM = 0.46;                 // Unterkante des Papiers am Ende (Anteil der Umschlaghöhe, von oben)
    const PAPER_START_TOP = 0.40;                  // Oberkante des Papiers im Umschlag (versteckt hinter der Tasche)

    // Laternen-Positionen in Prozent (%) relativ zum Bild (Hochformat)
    const LANTERNS = [
      { id: 'L1',  x: 16, y: 8  },
      { id: 'L2',  x: 34, y: 15 },
      { id: 'L3',  x: 59, y: 14 },
      { id: 'L4',  x: 92, y: 4  },
      { id: 'L5',  x: 10, y: 27 },
      { id: 'L6',  x: 27, y: 24 },
      { id: 'L7',  x: 21, y: 38 },
      { id: 'L8',  x: 45, y: 39 },
      { id: 'L9',  x: 71, y: 38 },
      { id: 'L10', x: 92, y: 34 },
      { id: 'L11', x: 14, y: 46 },
      { id: 'L12', x: 38, y: 46 },
      { id: 'L13', x: 60, y: 46 },
      { id: 'L14', x: 82, y: 46 },
      { id: 'L15', x: 42, y: 57 },
      { id: 'L16', x: 62, y: 57 }
    ];

    const STAGE_1_IDS = new Set(['L2', 'L3', 'L8']);
    const STAGE_2_IDS = new Set(['L2', 'L3', 'L8', 'L1', 'L6', 'L7', 'L9', 'L12', 'L13']);

    let started = false;
    let interactive = false;   // Laternen erst anklickbar, wenn der Vorhang offen ist
    let lightLevel = 0;

    // Phase-1-Status (audio_1.mp3)
    let phase1Started = false;
    let phase1UseFallback = false;
    let phase1ClockStart = 0;
    let phase1EndedAt = null;
    let phase1RafId = null;

    // Phase-2-Status (audio_2.mp3 + Streicheln + Vorhang schließen hinter der Katze)
    let phase2Triggered = false;
    let phase2AudioStarted = false;
    let phase2UseFallback = false;
    let phase2ClockStart = 0;
    let phase2EndedAt = null;
    let phase2RafId = null;
    let waitingForPet = false;
    let petCompleted = false;
    let pointerDownOnCat = null;

    // Memory-Status
    let memoryBuilt = false;
    let memoryStarted = false;
    let memoryComplete = false;   // true, sobald alle 12 Karten gelandet sind
    let memoryReady = false;      // true, sobald der Katzen-Auftritt vorbei ist und das Spiel freigegeben ist
    let memoryLocked = false;     // blockiert Taps während der Auswertung
    let memoryOpen = [];          // aktuell aufgedeckte, noch nicht ausgewertete Karten
    let memoryMatched = 0;        // gefundene Pärchen
    let memoryWon = false;        // true, sobald alle 6 Pärchen gefunden wurden
    const memoryCells = [];   // { el, row, col } – row 0 = oben, row 3 = unten

    const nodesById = new Map();

    // Audio auf dem Handy (iOS/Safari) freischalten: muss direkt im Klick passieren
    function unlockAudio(a) {
      if (!a) return;
      a.muted = true;
      const p = a.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          a.pause();
          a.currentTime = 0;
          a.muted = false;
        }).catch(() => {
          a.muted = false;
        });
      }
    }

    function buildLanterns() {
      lanternLayer.innerHTML = '';
      LANTERNS.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lantern-node';
        btn.style.setProperty('--x', `${item.x}%`);
        btn.style.setProperty('--y', `${item.y}%`);
        btn.setAttribute('aria-label', `Laterne ${item.id}`);

        const glow = document.createElement('span');
        glow.className = 'lantern-glow';
        btn.appendChild(glow);

        lanternLayer.appendChild(btn);
        nodesById.set(item.id, btn);
      });
    }

    function hideBothBubbles() {
      speechBubble1.classList.remove('visible');
      speechBubble2.classList.remove('visible');
      speechBubble1.classList.add('hidden-away');
      speechBubble2.classList.add('hidden-away');
      speechStack.classList.remove('has-second');
    }

    function resetBubblesForNewSequence() {
      speechBubble1.textContent = '';
      speechBubble2.textContent = '';
      speechBubble1.classList.remove('visible', 'hidden-away');
      speechBubble2.classList.remove('visible', 'hidden-away');
      speechStack.classList.remove('has-second');
    }

    function applyLightLevel(newLevel) {
      lightLevel = Math.max(0, Math.min(3, newLevel));
      invitationStage.dataset.level = String(lightLevel);

      LANTERNS.forEach((item) => {
        const el = nodesById.get(item.id);
        if (!el) return;
        let isLit = false;
        if (lightLevel === 1) isLit = STAGE_1_IDS.has(item.id);
        else if (lightLevel === 2) isLit = STAGE_2_IDS.has(item.id);
        else if (lightLevel >= 3) isLit = true;

        el.classList.toggle('lit', isLit);
      });

      if (lightLevel >= 3 && !phase2Triggered) {
        phase2Triggered = true;
        if (phase1RafId) cancelAnimationFrame(phase1RafId);
        if (catAudio1 && !catAudio1.paused) {
          catAudio1.pause();
        }
        hideBothBubbles();

        window.setTimeout(() => {
          startPhase2AudioAndDialogue();
        }, PHASE2_TIMELINE.startDelay * 1000);
      }
    }

    function findNearestLantern(clientX, clientY) {
      const rect = invitationStage.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;

      const tapXPercent = ((clientX - rect.left) / rect.width) * 100;
      const tapYPercent = ((clientY - rect.top) / rect.height) * 100;

      const maxTouchRadiusPercent = 22;
      let best = null;
      let bestDist = Infinity;

      for (const item of LANTERNS) {
        const dx = item.x - tapXPercent;
        const dy = item.y - tapYPercent;
        const dist = Math.hypot(dx, dy);
        if (dist <= maxTouchRadiusPercent && dist < bestDist) {
          bestDist = dist;
          best = item;
        }
      }

      return best;
    }

    function handleStageTap(clientX, clientY) {
      if (!interactive) return;
      if (!invitationStage.classList.contains('ready')) return;
      if (lightLevel >= 3) return;

      const hitLantern = findNearestLantern(clientX, clientY);
      if (hitLantern) {
        const el = nodesById.get(hitLantern.id);
        if (el) {
          el.classList.add('lit');
        }
        applyLightLevel(lightLevel + 1);
      }
    }

    invitationStage.addEventListener('pointerdown', (event) => {
      handleStageTap(event.clientX, event.clientY);
    });

    // --- Phase 1: Audio 1 + 2 Sprechblasen (mit 1s Verzögerung nach Vorhang-Öffnung) ---
    function getPhase1Elapsed() {
      const wallElapsed = Math.max(0, (performance.now() - phase1ClockStart) / 1000);
      if (!phase1UseFallback && catAudio1) {
        if (catAudio1.ended) {
          if (phase1EndedAt === null) {
            phase1EndedAt = wallElapsed;
          }
          return (catAudio1.duration || PHASE1_TIMELINE.part2End) + Math.max(0, wallElapsed - phase1EndedAt);
        }
        if (!catAudio1.paused && catAudio1.currentTime > 0) {
          return catAudio1.currentTime;
        }
      }
      return wallElapsed;
    }

    function updatePhase1Bubbles() {
      if (lightLevel >= 3 || phase2Triggered) {
        hideBothBubbles();
        return;
      }

      const t = getPhase1Elapsed();

      if (t >= PHASE1_TIMELINE.part1Start) {
        const duration1 = Math.max(0.5, PHASE1_TIMELINE.part1End - PHASE1_TIMELINE.part1Start);
        const progress1 = Math.min(1, Math.max(0, (t - PHASE1_TIMELINE.part1Start) / duration1));
        const charCount1 = Math.max(1, Math.ceil(progress1 * PHASE1_PART1_TEXT.length));
        speechBubble1.textContent = PHASE1_PART1_TEXT.slice(0, charCount1);
        speechBubble1.classList.remove('hidden-away');
        speechBubble1.classList.add('visible');
      }

      if (t >= PHASE1_TIMELINE.part2Start) {
        const duration2 = Math.max(0.5, PHASE1_TIMELINE.part2End - PHASE1_TIMELINE.part2Start);
        const progress2 = Math.min(1, Math.max(0, (t - PHASE1_TIMELINE.part2Start) / duration2));
        const charCount2 = Math.max(1, Math.ceil(progress2 * PHASE1_PART2_TEXT.length));
        speechBubble2.textContent = PHASE1_PART2_TEXT.slice(0, charCount2);
        speechBubble2.classList.remove('hidden-away');
        speechBubble2.classList.add('visible');
        speechStack.classList.add('has-second');
      }

      if (t < PHASE1_TIMELINE.part2End + 0.5) {
        phase1RafId = requestAnimationFrame(updatePhase1Bubbles);
      } else {
        speechBubble1.textContent = PHASE1_PART1_TEXT;
        speechBubble1.classList.remove('hidden-away');
        speechBubble1.classList.add('visible');
        speechBubble2.textContent = PHASE1_PART2_TEXT;
        speechBubble2.classList.remove('hidden-away');
        speechBubble2.classList.add('visible');
        speechStack.classList.add('has-second');
      }
    }

    function startPhase1AudioAndDialogue() {
      if (phase1Started || lightLevel >= 3) return;
      phase1Started = true;
      resetBubblesForNewSequence();
      phase1ClockStart = performance.now();
      phase1EndedAt = null;

      if (catAudio1) {
        catAudio1.currentTime = 0;
        const playPromise = catAudio1.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(() => {
            phase1UseFallback = false;
          }).catch(() => {
            phase1UseFallback = true;
          });
        }
      } else {
        phase1UseFallback = true;
      }

      if (phase1RafId) cancelAnimationFrame(phase1RafId);
      phase1RafId = requestAnimationFrame(updatePhase1Bubbles);
    }

    if (catAudio1) {
      catAudio1.addEventListener('error', () => {
        phase1UseFallback = true;
      });
    }

    // --- Phase 2: Audio 2 + Sprechblasen + Streicheln + Vorhang schließt hinter Katze ---
    function getPhase2TimelineMetrics() {
      const hasRealDuration = Boolean(
        !phase2UseFallback &&
        catAudio2 &&
        Number.isFinite(catAudio2.duration) &&
        catAudio2.duration > 3
      );

      if (hasRealDuration) {
        const totalSpeakable = Math.max(4, catAudio2.duration - PHASE2_TIMELINE.pauseBetweenParts);
        const weight1 = PHASE2_PART1_TEXT.length;
        const weight2 = PHASE2_PART2_TEXT.length;
        const weightSum = weight1 + weight2;
        const part1Duration = Math.max(2.0, totalSpeakable * (weight1 / weightSum));
        const part2Start = part1Duration + PHASE2_TIMELINE.pauseBetweenParts;
        const part2End = Math.min(catAudio2.duration, part2Start + Math.max(2.0, totalSpeakable * (weight2 / weightSum)));

        return {
          part1Start: 0,
          part1End: part1Duration,
          part2Start,
          part2End: Math.max(part2Start + 1.5, part2End)
        };
      }

      const part1End = PHASE2_TIMELINE.part1DefaultDuration;
      const part2Start = part1End + PHASE2_TIMELINE.pauseBetweenParts;
      const part2End = part2Start + PHASE2_TIMELINE.part2DefaultDuration;
      return {
        part1Start: 0,
        part1End,
        part2Start,
        part2End
      };
    }

    function getPhase2Elapsed() {
      const wallElapsed = Math.max(0, (performance.now() - phase2ClockStart) / 1000);
      if (!phase2UseFallback && catAudio2) {
        if (catAudio2.ended) {
          if (phase2EndedAt === null) {
            phase2EndedAt = wallElapsed;
          }
          const metrics = getPhase2TimelineMetrics();
          return (catAudio2.duration || metrics.part2End) + Math.max(0, wallElapsed - phase2EndedAt);
        }
        if (!catAudio2.paused && catAudio2.currentTime > 0) {
          return catAudio2.currentTime;
        }
      }
      return wallElapsed;
    }

    function enablePettingMode() {
      if (petCompleted) return;
      waitingForPet = true;
      manekiWrap.classList.add('pettable');
    }

    function closeCurtainBehindCat() {
      // 1. Katze im z-index über den Vorhang heben (35 > 28)
      manekiWrap.classList.add('in-front-of-curtain');

      // 2. Auf den nächsten Frame warten, damit der Layer-Wechsel greift, dann Vorhang schließen
      requestAnimationFrame(() => {
        curtainContainer.classList.remove('open');
        curtainContainer.classList.add('visible', 'closing');
      });

      // 3. Sobald der Vorhang geschlossen ist (nach der 2.1s Schließ-Transition), Hintergrundbild ausblenden
      window.setTimeout(() => {
        invitationStage.classList.add('bg-hidden');

        // 4. Kurz danach baut sich das Memory-Spielfeld über der weiter winkenden Katze auf
        window.setTimeout(startMemoryBoard, 300);
      }, 2120);
    }

    function completePetting() {
      if (petCompleted || !waitingForPet) return;
      petCompleted = true;
      waitingForPet = false;
      manekiWrap.classList.remove('pettable');
      if (phase2RafId) cancelAnimationFrame(phase2RafId);
      if (catAudio2 && !catAudio2.paused) catAudio2.pause();
      hideBothBubbles();
      closeCurtainBehindCat();
    }

    function updatePhase2Bubbles() {
      if (petCompleted) {
        hideBothBubbles();
        return;
      }

      const t = getPhase2Elapsed();
      const metrics = getPhase2TimelineMetrics();
      const audioFinished = Boolean(catAudio2 && catAudio2.ended);

      if (t >= metrics.part1Start) {
        const duration1 = Math.max(1.0, metrics.part1End - metrics.part1Start);
        const progress1 = Math.min(1, Math.max(0, (t - metrics.part1Start) / duration1));
        const charCount1 = Math.max(1, Math.ceil(progress1 * PHASE2_PART1_TEXT.length));
        speechBubble1.textContent = PHASE2_PART1_TEXT.slice(0, charCount1);
        speechBubble1.classList.remove('hidden-away');
        speechBubble1.classList.add('visible');
      }

      if (t >= metrics.part2Start) {
        const duration2 = Math.max(1.0, metrics.part2End - metrics.part2Start);
        const progress2 = Math.min(1, Math.max(0, (t - metrics.part2Start) / duration2));
        const charCount2 = Math.max(1, Math.ceil(progress2 * PHASE2_PART2_TEXT.length));
        speechBubble2.textContent = PHASE2_PART2_TEXT.slice(0, charCount2);
        speechBubble2.classList.remove('hidden-away');
        speechBubble2.classList.add('visible');
        speechStack.classList.add('has-second');
      }

      if (audioFinished || t >= metrics.part2End) {
        speechBubble1.textContent = PHASE2_PART1_TEXT;
        speechBubble1.classList.remove('hidden-away');
        speechBubble1.classList.add('visible');
        speechBubble2.textContent = PHASE2_PART2_TEXT;
        speechBubble2.classList.remove('hidden-away');
        speechBubble2.classList.add('visible');
        speechStack.classList.add('has-second');
        enablePettingMode();
      }

      if (!petCompleted) {
        phase2RafId = requestAnimationFrame(updatePhase2Bubbles);
      }
    }

    function startPhase2AudioAndDialogue() {
      if (phase2AudioStarted || petCompleted) return;
      phase2AudioStarted = true;
      resetBubblesForNewSequence();
      phase2ClockStart = performance.now();
      phase2EndedAt = null;
      // Streicheln wird erst am Ende der Sprachnachricht freigeschaltet (siehe updatePhase2Bubbles / 'ended')

      if (catAudio2) {
        catAudio2.currentTime = 0;
        const playPromise = catAudio2.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(() => {
            phase2UseFallback = false;
          }).catch(() => {
            phase2UseFallback = true;
          });
        }
      } else {
        phase2UseFallback = true;
      }

      if (phase2RafId) cancelAnimationFrame(phase2RafId);
      phase2RafId = requestAnimationFrame(updatePhase2Bubbles);
    }

    if (catAudio2) {
      catAudio2.addEventListener('error', () => {
        phase2UseFallback = true;
      });
      catAudio2.addEventListener('ended', () => {
        enablePettingMode();
      });
    }

    manekiWrap.addEventListener('pointerdown', (event) => {
      event.stopPropagation();
      pointerDownOnCat = { x: event.clientX, y: event.clientY };
      if (waitingForPet && !petCompleted) {
        completePetting();
      }
    });

    manekiWrap.addEventListener('pointermove', (event) => {
      if (!pointerDownOnCat || petCompleted || !waitingForPet) return;
      const dist = Math.hypot(event.clientX - pointerDownOnCat.x, event.clientY - pointerDownOnCat.y);
      if (dist >= 12) {
        completePetting();
      }
    });

    manekiWrap.addEventListener('pointerup', (event) => {
      event.stopPropagation();
      pointerDownOnCat = null;
      if (waitingForPet && !petCompleted) {
        completePetting();
      }
    });

    manekiWrap.addEventListener('pointercancel', () => {
      pointerDownOnCat = null;
    });

    // =====================================================================
    // Soundeffekte (knall.mp3, richtig.mp3, falsch.mp3)
    // Primär über Web Audio (vorab dekodiert, exakt planbar), mit HTMLAudio als Notlösung.
    // =====================================================================
    const SFX_FILES = {
      knall: 'knall.mp3',
      richtig: 'richtig.mp3',
      falsch: 'falsch.mp3',
      hatschi: 'hatschi.mp3'
    };

    let audioCtx = null;
    const sfxBuffers = {};     // dekodierte AudioBuffer
    const sfxLeadIn = {};      // Sekunden Stille am Dateianfang (wird beim Abspielen übersprungen)
    const sfxPeak = {};        // Sekunden bis zum lautesten Moment (z. B. das "-tschi" beim Niesen)
    const sfxPools = {};       // Notlösung: HTMLAudio-Instanzen
    const sfxPoolIndex = {};

    function detectLeadIn(buffer) {
      // Findet den ersten hörbaren Moment, damit MP3-Vorlauf/Stille den Knall nicht verspätet
      try {
        const data = buffer.getChannelData(0);
        const threshold = 0.03;
        for (let i = 0; i < data.length; i++) {
          if (Math.abs(data[i]) > threshold) {
            return Math.max(0, i / buffer.sampleRate - 0.004);
          }
        }
      } catch (err) { /* ignorieren */ }
      return 0;
    }

    // Findet den ersten wirklich lauten Moment der Datei (Fenster à 20 ms, >= 80 % der maximalen Lautstärke)
    function detectPeakTime(buffer) {
      try {
        const data = buffer.getChannelData(0);
        const win = Math.max(1, Math.round(buffer.sampleRate * 0.02));
        const rms = [];
        let maxRms = 0;
        for (let i = 0; i + win <= data.length; i += win) {
          let sum = 0;
          for (let j = i; j < i + win; j++) sum += data[j] * data[j];
          const v = Math.sqrt(sum / win);
          rms.push(v);
          if (v > maxRms) maxRms = v;
        }
        for (let k = 0; k < rms.length; k++) {
          if (rms[k] >= maxRms * 0.8) return (k * win) / buffer.sampleRate;
        }
      } catch (err) { /* ignorieren */ }
      return 0;
    }

    function loadSfx(name) {
      if (!audioCtx || typeof fetch !== 'function') return;
      fetch(SFX_FILES[name])
        .then((res) => {
          if (!res.ok) throw new Error('sfx not found');
          return res.arrayBuffer();
        })
        .then((arr) => new Promise((resolve, reject) => audioCtx.decodeAudioData(arr, resolve, reject)))
        .then((decoded) => {
          sfxBuffers[name] = decoded;
          sfxLeadIn[name] = detectLeadIn(decoded);
          sfxPeak[name] = detectPeakTime(decoded);
        })
        .catch(() => { /* Notlösung (HTMLAudio) greift dann automatisch */ });
    }

    function initSfx() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try {
          audioCtx = new AC();
        } catch (err) {
          audioCtx = null;
        }
      }
      Object.keys(SFX_FILES).forEach(loadSfx);
    }

    // Muss direkt im Start-Klick laufen (iOS/Safari)
    function unlockSfx() {
      if (audioCtx) {
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const silent = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = silent;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (err) { /* ignorieren */ }
      }
      Object.keys(SFX_FILES).forEach((name) => {
        if (!sfxBuffers[name]) ensureFallbackPool(name).forEach(unlockAudio);
      });
    }

    function ensureFallbackPool(name) {
      if (!sfxPools[name]) {
        const size = name === 'knall' ? KNALL_POOL_SIZE : 2;
        sfxPools[name] = Array.from({ length: size }, () => {
          const a = new Audio(SFX_FILES[name]);
          a.preload = 'auto';
          return a;
        });
        sfxPoolIndex[name] = 0;
      }
      return sfxPools[name];
    }

    function playSfxFallback(name) {
      const pool = ensureFallbackPool(name);
      const a = pool[sfxPoolIndex[name] % pool.length];
      sfxPoolIndex[name]++;
      try {
        a.pause();
        a.currentTime = 0;
      } catch (err) { /* ignorieren */ }
      const p = a.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }

    // Spielt über Web Audio ab. atPerfMs = Zeitpunkt (performance.now()-Zeitbasis), zu dem der Klang erklingen soll.
    // Gibt true zurück, wenn Web Audio genutzt wurde.
    function playSfx(name, atPerfMs) {
      const buf = sfxBuffers[name];
      if (!audioCtx || !buf) return false;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);

        let when = audioCtx.currentTime;
        if (typeof atPerfMs === 'number' && Number.isFinite(atPerfMs)) {
          const delaySec = (atPerfMs - performance.now()) / 1000;
          const latency = audioCtx.outputLatency || audioCtx.baseLatency || 0;
          when = Math.max(audioCtx.currentTime, audioCtx.currentTime + delaySec - latency);
        }
        src.start(when, sfxLeadIn[name] || 0);
        return true;
      } catch (err) {
        return false;
      }
    }

    function playSfxNow(name) {
      if (!playSfx(name)) playSfxFallback(name);
    }

    function sfxDurationMs(name) {
      const buf = sfxBuffers[name];
      if (buf) return Math.max(0, (buf.duration - (sfxLeadIn[name] || 0)) * 1000);
      const pool = ensureFallbackPool(name);
      const d = pool[0] && Number.isFinite(pool[0].duration) ? pool[0].duration * 1000 : 800;
      return d;
    }

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    // =====================================================================
    // Memory-Spielfeld: 3 Spalten x 4 Reihen
    // Reihe 1 + 2 (oben): 6 Bildkarten | Reihe 3 + 4 (unten): 6 Jahreszahlkarten
    // Jede Karte hat Vorderseite (Bild/Jahreszahl, verdeckt) und Rückseite (logo.png, liegt oben).
    // =====================================================================
    function shuffleArray(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Rückseite (identisch für alle 12 Karten): logo.png, mit Platzhalter-Emblem falls die Datei fehlt
    function createBackFace() {
      const back = document.createElement('div');
      back.className = 'mem-face mem-back';

      const ph = document.createElement('div');
      ph.className = 'mem-logo-ph';
      ph.innerHTML =
        '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" aria-hidden="true">' +
        '<circle cx="32" cy="32" r="28" stroke-width="3"/>' +
        '<circle cx="32" cy="32" r="22" stroke-width="1.2"/>' +
        '<text x="32" y="39" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="currentColor" stroke="none">60</text>' +
        '</svg>';
      back.appendChild(ph);

      const img = new Image();
      img.className = 'mem-logo';
      img.alt = '';
      img.decoding = 'async';
      img.onload = () => {
        img.classList.add('loaded');
        back.classList.add('has-logo');
      };
      img.onerror = () => img.remove();
      img.src = 'logo.png';
      back.appendChild(img);

      return back;
    }

    function createImageCard(n) {
      const card = document.createElement('div');
      card.className = 'mem-card mem-image';
      card.dataset.type = 'image';
      card.dataset.pair = String(n);   // bild<n>.jpg gehört zur n-kleinsten Jahreszahl

      const inner = document.createElement('div');
      inner.className = 'mem-inner';

      const front = document.createElement('div');
      front.className = 'mem-face mem-front';

      // Platzhalter liegt immer darunter und bleibt sichtbar, falls das Bild fehlt oder nicht lädt
      const ph = document.createElement('div');
      ph.className = 'mem-ph';
      ph.innerHTML =
        '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' +
        '<rect x="8" y="12" width="48" height="40" rx="5"/>' +
        '<circle cx="22" cy="26" r="5"/>' +
        '<path d="M10 48l14-14 10 10 8-8 12 12"/>' +
        '</svg>' +
        '<span>Bild ' + n + '</span>';
      front.appendChild(ph);

      // Bild blendet erst ein, wenn es wirklich geladen ist; bei Fehler wird es entfernt
      const img = new Image();
      img.className = 'mem-img';
      img.alt = '';
      img.decoding = 'async';
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => img.remove();
      img.src = 'bild' + n + '.jpg';
      front.appendChild(img);

      inner.appendChild(front);
      inner.appendChild(createBackFace());
      card.appendChild(inner);
      return card;
    }

    // rank 0 = kleinste Jahreszahl (gehört zu bild1.jpg) ... rank 5 = größte Jahreszahl (gehört zu bild6.jpg)
    function createYearCard(rank) {
      const card = document.createElement('div');
      card.className = 'mem-card mem-year';
      card.dataset.type = 'year';
      card.dataset.pair = String(rank + 1);

      const inner = document.createElement('div');
      inner.className = 'mem-inner';

      const front = document.createElement('div');
      front.className = 'mem-face mem-front';
      const label = document.createElement('span');
      label.textContent = MEMORY_YEARS_SORTED[rank];
      front.appendChild(label);

      inner.appendChild(front);
      inner.appendChild(createBackFace());
      card.appendChild(inner);
      return card;
    }

    function buildMemoryBoard() {
      if (memoryBuilt) return;
      memoryBuilt = true;

      const backdrop = document.createElement('div');
      backdrop.className = 'mem-backdrop';
      memoryBoard.appendChild(backdrop);

      // Innerhalb der Gruppen gemischt: 6 Bilder auf die oberen 6 Felder, 6 Jahre auf die unteren 6 Felder
      const imageOrder = shuffleArray(Array.from({ length: MEMORY_IMAGE_COUNT }, (_, i) => i + 1));
      const yearOrder = shuffleArray(Array.from({ length: MEMORY_YEARS_SORTED.length }, (_, i) => i));

      for (let slot = 0; slot < 6; slot++) {
        const row = Math.floor(slot / 3);   // 0 oder 1  -> Reihe 1 + 2
        const col = slot % 3;
        const card = createImageCard(imageOrder[slot]);
        card.style.gridRow = String(row + 1);
        card.style.gridColumn = String(col + 1);
        memoryBoard.appendChild(card);
        memoryCells.push({ el: card, row, col });
      }

      for (let slot = 0; slot < 6; slot++) {
        const row = 2 + Math.floor(slot / 3);   // 2 oder 3 -> Reihe 3 + 4
        const col = slot % 3;
        const card = createYearCard(yearOrder[slot]);
        card.style.gridRow = String(row + 1);
        card.style.gridColumn = String(col + 1);
        memoryBoard.appendChild(card);
        memoryCells.push({ el: card, row, col });
      }
    }

    // Eine Karte fällt. knall.mp3 wird exakt auf den Landezeitpunkt (Startzeit der Animation + Fallzeit) eingeplant.
    // Danach federt die Karte nach, und nach kurzer Pause fällt die nächste Karte.
    function dropMemoryCard(order, i) {
      if (i >= order.length) {
        finishMemoryBoard();
        return;
      }

      const cell = order[i];
      const el = cell.el;
      el.style.visibility = 'visible';

      const next = () => window.setTimeout(() => dropMemoryCard(order, i + 1), MEMORY_PAUSE_BETWEEN_MS);

      if (typeof el.animate !== 'function') {
        playSfxNow('knall');
        next();
        return;
      }

      const fallAnim = el.animate(
        [
          { transform: `translateY(${-cell.fall}px)` },
          { transform: 'translateY(0px)' }
        ],
        { duration: cell.dur, easing: 'cubic-bezier(0.5, 0, 0.9, 0.55)', fill: 'both' }
      );

      let knallScheduled = false;
      if (fallAnim.ready && typeof fallAnim.ready.then === 'function') {
        fallAnim.ready.then(() => {
          const startTime = Number(fallAnim.startTime);
          if (Number.isFinite(startTime)) {
            knallScheduled = playSfx('knall', startTime + cell.dur);
          }
        }).catch(() => {});
      }

      fallAnim.onfinish = () => {
        // Notlösung: falls der Klang nicht vorab eingeplant werden konnte, jetzt beim Aufsetzen abspielen
        if (!knallScheduled) playSfxFallback('knall');

        el.animate(
          [
            { transform: 'translateY(0px)' },
            { transform: 'translateY(-9px)', offset: 0.45 },
            { transform: 'translateY(0px)' }
          ],
          { duration: 320, easing: 'ease-out', fill: 'both' }
        );
        next();
      };
    }

    // Letzte Karte gelandet: mindestens 1 Sekunde warten, nachdem knall.mp3 verklungen ist, dann lugt die Katze hervor.
    function finishMemoryBoard() {
      memoryComplete = true;
      window.dispatchEvent(new CustomEvent('memory-complete'));
      window.setTimeout(() => {
        runMemoryCatPeek();
      }, sfxDurationMs('knall') + MEMORY_POST_KNALL_PAUSE_MS);
    }

    function startMemoryBoard() {
      if (memoryStarted) return;
      memoryStarted = true;
      buildMemoryBoard();

      const viewportH = window.innerHeight;
      const order = [];

      // Streng von unten nach oben: Reihe 4 (row 3), dann 3, 2, 1 (row 0).
      // Innerhalb einer Reihe zufällige Reihenfolge, aber immer einzeln nacheinander.
      for (let row = 3; row >= 0; row--) {
        const cellsInRow = shuffleArray(memoryCells.filter((c) => c.row === row));
        cellsInRow.forEach((cell) => {
          // Messen, solange noch keine Animation läuft: Karte liegt an ihrer Rasterposition
          const rect = cell.el.getBoundingClientRect();
          cell.fall = rect.bottom + 24;
          cell.dur = Math.round(
            MEMORY_FALL_MIN_MS + (MEMORY_FALL_MAX_MS - MEMORY_FALL_MIN_MS) * Math.min(1, cell.fall / viewportH)
          );
          order.push(cell);
        });
      }

      // Board einblenden (Karten selbst sind noch unsichtbar, Lücken zeigen die Katze), dann Karte für Karte fallen lassen
      memoryBoard.classList.add('show');
      dropMemoryCard(order, 0);
    }

    // =====================================================================
    // Katzen-Auftritt: Karte(n) vor der Katze rutschen zur Seite, Katze lugt hervor,
    // audio_3.mp3 + eine Sprechblase, Hervorhebung der Reihen, danach verschwindet die Katze wieder.
    // =====================================================================
    function animateTransform(el, from, to, duration) {
      if (typeof el.animate === 'function') {
        const anim = el.animate(
          [{ transform: from }, { transform: to }],
          { duration, easing: 'cubic-bezier(0.4, 0.1, 0.2, 1)', fill: 'both' }
        );
        return anim.finished.catch(() => {});
      }
      el.style.transform = to;
      return wait(duration);
    }

    function slideCells(cells, dx, f0, f1, duration) {
      return Promise.all(cells.map((c) =>
        animateTransform(c.el, `translateX(${dx * f0}px)`, `translateX(${dx * f1}px)`, duration)
      ));
    }

    // Karten, die die Katze gerade verdecken (in der Praxis die untere mittlere Karte)
    function getCatCoveringCells() {
      const cat = manekiWrap.getBoundingClientRect();
      const catArea = Math.max(1, cat.width * cat.height);
      let cells = memoryCells.filter((c) => {
        const r = c.el.getBoundingClientRect();
        const w = Math.min(r.right, cat.right) - Math.max(r.left, cat.left);
        const h = Math.min(r.bottom, cat.bottom) - Math.max(r.top, cat.top);
        return w > 0 && h > 0 && (w * h) / catArea > 0.08;
      });
      if (!cells.length) {
        cells = memoryCells.filter((c) => c.row === 3 && c.col === 1);
      }
      return cells;
    }

    // Dezente Hervorhebung: 'top' = obere 6 Karten, 'bottom' = untere 6 Karten, null = keine
    function setMemoryHint(group) {
      memoryCells.forEach((c) => {
        const isTop = c.row <= 1;
        const active = (group === 'top' && isTop) || (group === 'bottom' && !isTop);
        c.el.classList.toggle('hint', active);
      });
    }

    // Eine einzige Sprechblase, Text synchron zu audio_3.mp3; Hervorhebung passend zu "Oben sind Fotos" / "unten sind Jahreszahlen"
    function runMemoryIntro() {
      return new Promise((resolve) => {
        resetBubblesForNewSequence();

        const text = MEMORY_INTRO_TEXT;
        const len = text.length;
        const topStart = text.indexOf(MEMORY_HINT_TOP_PHRASE);
        const bottomStart = text.indexOf(MEMORY_HINT_BOTTOM_PHRASE);
        const topEnd = topStart + MEMORY_HINT_TOP_PHRASE.length;
        const bottomEnd = bottomStart + MEMORY_HINT_BOTTOM_PHRASE.length;

        let useFallback = false;
        let ended = false;
        let shownChars = 0;

        // Zeitgewichtung des Textes: Leerzeichen etwas kürzer, Komma/Punkt = kurze Sprechpause.
        // So wandert der angezeigte Text (und damit die Hervorhebung) näher am gesprochenen Wort mit.
        const cum = [0];
        for (let i = 0; i < len; i++) {
          const ch = text[i];
          let w = ch === ' ' ? 0.6 : 1;
          if (ch === '.') w += 5;
          else if (ch === ',') w += 2.5;
          cum.push(cum[i] + w);
        }
        const totalWeight = cum[len];
        const charsForProgress = (prog) => {
          if (prog >= 1) return len;
          const target = prog * totalWeight;
          let lo = 0;
          let hi = len;
          while (lo < hi) {
            const mid = (lo + hi + 1) >> 1;
            if (cum[mid] <= target) lo = mid;
            else hi = mid - 1;
          }
          return lo;
        };

        if (catAudio3) {
          try { catAudio3.currentTime = 0; } catch (err) { /* ignorieren */ }
          catAudio3.addEventListener('ended', () => { ended = true; }, { once: true });
          catAudio3.addEventListener('error', () => { useFallback = true; }, { once: true });
          const p = catAudio3.play();
          if (p && typeof p.catch === 'function') p.catch(() => { useFallback = true; });
        } else {
          useFallback = true;
        }

        const startTime = performance.now();

        function frame() {
          const wall = (performance.now() - startTime) / 1000;
          let duration = MEMORY_INTRO_FALLBACK_DURATION_S;
          let t = wall;

          if (!useFallback && catAudio3) {
            if (Number.isFinite(catAudio3.duration) && catAudio3.duration > 2) {
              duration = catAudio3.duration;
            }
            if (ended) {
              t = duration;
            } else if (!catAudio3.paused && catAudio3.currentTime > 0) {
              t = catAudio3.currentTime;
            } else {
              t = 0;   // Audio läuft noch nicht: Text wartet
            }
          }

          const done = ended || (useFallback && wall >= duration) || wall > duration + 6;
          const progress = done ? 1 : Math.min(1, t / (duration * MEMORY_INTRO_TEXT_END_RATIO));
          shownChars = Math.max(shownChars, charsForProgress(progress));

          if (shownChars > 0) {
            speechBubble1.textContent = text.slice(0, shownChars);
            speechBubble1.classList.remove('hidden-away');
            speechBubble1.classList.add('visible');
          }

          // Hervorhebung nach angezeigtem Text
          let group = null;
          if (topStart >= 0 && bottomStart >= 0) {
            if (shownChars > topStart && shownChars <= topEnd + 2) group = 'top';   // "Oben sind Fotos," -> obere 6 Karten
            else if (shownChars > bottomStart && shownChars <= bottomEnd + 1) group = 'bottom';   // "unten sind Jahreszahlen." -> untere 6 Karten
          }
          setMemoryHint(group);

          if (!done) {
            requestAnimationFrame(frame);
          } else {
            speechBubble1.textContent = text;
            setMemoryHint(null);
            window.setTimeout(resolve, MEMORY_INTRO_HOLD_MS);
          }
        }

        requestAnimationFrame(frame);
      });
    }

    async function runMemoryCatPeek() {
      const peekCells = getCatCoveringCells();
      const cardWidth = peekCells[0].el.getBoundingClientRect().width;
      const dir = Math.random() < 0.5 ? -1 : 1;
      const dx = dir * (cardWidth + MEMORY_PEEK_GAP_PX) * 0.96;

      // Karte rutscht UNTER die Nachbarkarte (z-index 0 < 1), erst ein Stück (Katze lugt), dann ganz
      peekCells.forEach((c) => { c.el.style.zIndex = '0'; });
      await slideCells(peekCells, dx, 0, 0.5, 650);
      await wait(450);
      await slideCells(peekCells, dx, 0.5, 1, 550);
      await wait(500);

      // Sprechblase über das Spielfeld legen und Ansage starten
      speechStack.classList.add('above-board');
      await runMemoryIntro();

      // Ansage vorbei: Blase weg, Karten rutschen zurück vor die Katze
      hideBothBubbles();
      await slideCells(peekCells, dx, 1, 0, 750);
      peekCells.forEach((c) => { c.el.style.zIndex = ''; });
      speechStack.classList.remove('above-board');

      // Spielfeld schließen (Hintergrund), Katze verschwindet aus der Szene, Spiel freigeben
      memoryBoard.classList.add('covered');
      memoryBoard.classList.add('ready');
      memoryReady = true;
      window.dispatchEvent(new CustomEvent('memory-ready'));
      window.setTimeout(() => {
        manekiWrap.style.display = 'none';
      }, 800);
    }

    // =====================================================================
    // Spiellogik: Bild + zugehörige Jahreszahl = Pärchen
    // =====================================================================
    function handleMemoryTap(card) {
      if (!memoryReady || memoryLocked || memoryWon) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      memoryOpen.push(card);

      if (memoryOpen.length === 2) {
        memoryLocked = true;   // weitere Taps blockieren, bis ausgewertet ist
        window.setTimeout(evaluateMemoryPair, MEMORY_EVAL_DELAY_MS);
      }
    }

    function evaluateMemoryPair() {
      const [a, b] = memoryOpen;
      if (!a || !b) {
        memoryOpen = [];
        memoryLocked = false;
        return;
      }

      // Treffer nur, wenn ein Bild und eine Jahreszahl zusammengehören
      const isMatch = a.dataset.type !== b.dataset.type && a.dataset.pair === b.dataset.pair;

      if (isMatch) {
        a.classList.add('matched');
        b.classList.add('matched');
        playSfxNow('richtig');
        memoryOpen = [];
        memoryMatched++;

        if (memoryMatched >= MEMORY_PAIR_COUNT) {
          memoryWon = true;   // alle 6 Pärchen gefunden, alle 12 Karten offen
          window.dispatchEvent(new CustomEvent('memory-won'));
        } else {
          memoryLocked = false;
        }
      } else {
        playSfxNow('falsch');
        window.setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          window.setTimeout(() => {
            memoryOpen = [];
            memoryLocked = false;
          }, MEMORY_FLIP_MS + 50);
        }, MEMORY_WRONG_SHOW_MS);
      }
    }

    memoryBoard.addEventListener('click', (event) => {
      const card = event.target.closest('.mem-card');
      if (card) handleMemoryTap(card);
    });

    // =====================================================================
    // Finale: Karten fallen weg, Katze niest (hatschi.mp3), roter Umschlag fliegt in einer Spirale heran,
    // öffnet sich und zieht die Einladung (einladung.jpg) heraus.
    // =====================================================================
    const envelope = document.getElementById('envelope');
    const envPaper = document.getElementById('envPaper');
    const envFlap = document.getElementById('envFlap');
    let finaleStarted = false;
    let envelopeLanded = false;
    let envelopeGeom = null;     // { vw, vh, envW, envH, E, S, C, R, r0, phi0, sweep }
    let inviteRatio = 0;         // Breite / Höhe von einladung.jpg, sobald geladen

    function animateEl(el, from, to, duration, easing, delay) {
      if (typeof el.animate === 'function') {
        const anim = el.animate(
          [{ transform: from }, { transform: to }],
          { duration, delay: delay || 0, easing: easing || 'ease-in-out', fill: 'both' }
        );
        return anim.finished.catch(() => {});
      }
      el.style.transform = to;
      return wait(duration + (delay || 0));
    }

    // einladung.jpg vorladen; Platzhalter bleibt sichtbar, bis das Bild wirklich da ist
    function initEnvelope() {
      const img = new Image();
      img.className = 'paper-img';
      img.alt = 'Einladung';
      img.decoding = 'async';
      img.onload = () => {
        if (img.naturalWidth && img.naturalHeight) {
          inviteRatio = img.naturalWidth / img.naturalHeight;
        }
        img.classList.add('loaded');
      };
      img.onerror = () => img.remove();
      img.src = 'einladung.jpg';
      envPaper.appendChild(img);
    }

    // 1) Alle 12 Karten fallen aufgedeckt, schnell und ohne Geräusch nach unten aus dem Bildschirm
    function dropAllMemoryCardsAway() {
      const vh = window.innerHeight;
      const ordered = [];
      for (let row = 3; row >= 0; row--) {
        shuffleArray(memoryCells.filter((c) => c.row === row)).forEach((c) => ordered.push(c));
      }
      const jobs = ordered.map((cell, i) => {
        const rect = cell.el.getBoundingClientRect();
        const dist = vh - rect.top + 40;
        return animateEl(
          cell.el,
          'translateY(0px)',
          `translateY(${dist}px)`,
          FINALE_CARD_FALL_MS,
          'cubic-bezier(0.5, 0, 0.9, 0.55)',
          i * FINALE_CARD_STAGGER_MS
        );
      });
      return Promise.all(jobs);
    }

    // 2) Katze zuckt beim Niesen kurz
    function catSneezeShake() {
      if (typeof manekiWrap.animate !== 'function') return;
      const base = 'translateX(-50%)';
      manekiWrap.animate(
        [
          { transform: `${base} translateY(0px) scale(1, 1)` },
          { transform: `${base} translateY(6px) scale(1.05, 0.93)`, offset: 0.3 },
          { transform: `${base} translateY(-5px) scale(0.98, 1.04)`, offset: 0.6 },
          { transform: `${base} translateY(0px) scale(1, 1)` }
        ],
        { duration: 420, easing: 'ease-out' }
      );
    }

    // 3) Geometrie der Spirale: Mittelpunkt C liegt senkrecht über dem Endpunkt E, so dass nach genau
    //    drei Runden (+ kleinem Rest-Winkel) die Position unter C erreicht ist und die Drehung 0° ergibt.
    function computeEnvelopeGeometry() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const envW = vw * ENVELOPE_WIDTH_RATIO;
      const envH = envW * ENVELOPE_ASPECT;
      const bottomMargin = Math.max(vh * ENVELOPE_BOTTOM_RATIO, 16);
      const E = { x: vw / 2, y: vh - bottomMargin - envH / 2 };   // Endmitte des Umschlags

      const cat = manekiWrap.getBoundingClientRect();
      const S = {
        x: Math.min(cat.left + cat.width * (0.5 + ENVELOPE_START_X), E.x - 6),
        y: Math.min(cat.top + cat.height * ENVELOPE_START_Y, E.y - 10)
      };

      // Radius der größten Runde: so groß, dass der Startradius sicher kleiner ist
      const delta = E.y - S.y;
      let R = Math.max(vh * 0.12, 1.5 * delta + 40);
      let r0 = Math.hypot(S.x - E.x, S.y - (E.y - R));
      for (let g = 0; g < 40 && r0 > R * 0.8; g++) {
        R += 8;
        r0 = Math.hypot(S.x - E.x, S.y - (E.y - R));
      }
      const C = { x: E.x, y: E.y - R };

      // Winkel in Grad, mathematisch (0° = rechts, 90° = oben, -90° = unten), gegen den Uhrzeigersinn wachsend
      const phi0 = Math.atan2(-(S.y - C.y), S.x - C.x) * 180 / Math.PI;
      const diff = (((-90 - phi0) % 360) + 360) % 360;   // Rest bis zur Position direkt unter C
      const sweep = ENVELOPE_LAPS * 360 + diff;

      return { vw, vh, envW, envH, E, S, C, R, r0, phi0, sweep };
    }

    function applyEnvelopeSize(geom) {
      envelope.style.setProperty('--ew', geom.envW + 'px');
      envelope.style.setProperty('--eh', geom.envH + 'px');
    }

    function setEnvelopeTransform(x, y, rotateDeg, scale, geom) {
      envelope.style.transform =
        `translate3d(${(x - geom.envW / 2).toFixed(2)}px, ${(y - geom.envH / 2).toFixed(2)}px, 0) ` +
        `rotate(${rotateDeg.toFixed(3)}deg) scale(${scale.toFixed(4)})`;
    }

    // Spirale per requestAnimationFrame:
    //   Winkel   phi(p) = phi0 + sweep * p      (gegen den Uhrzeigersinn)
    //   Radius   r(p)   = r0 + (R - r0) * p     (wird mit jeder Runde größer)
    //   Position = C + r * (cos phi, -sin phi)  (Bildschirm-y zeigt nach unten)
    //   Drehung  rho(p) = -90 - phi(p)          (CSS, im Uhrzeigersinn positiv): die Unterseite des Umschlags zeigt immer radial nach außen
    //   Größe    s(p)   = s0 + (1 - s0) * p^1.7
    function flyEnvelopeSpiral() {
      return new Promise((resolve) => {
        const geom = computeEnvelopeGeometry();
        envelopeGeom = geom;
        applyEnvelopeSize(geom);
        envelope.classList.add('show');

        const rad = Math.PI / 180;
        const startTime = performance.now();

        function frame(now) {
          const t = Math.min(1, (now - startTime) / ENVELOPE_SPIRAL_MS);
          const p = (1 - Math.cos(Math.PI * t)) / 2;   // sanfter Start und sanfte Landung

          const phi = geom.phi0 + geom.sweep * p;
          const r = geom.r0 + (geom.R - geom.r0) * p;
          const x = geom.C.x + r * Math.cos(phi * rad);
          const y = geom.C.y - r * Math.sin(phi * rad);
          const rho = -90 - phi;
          const scale = ENVELOPE_START_SCALE + (1 - ENVELOPE_START_SCALE) * Math.pow(p, 1.7);

          setEnvelopeTransform(x, y, rho, scale, geom);

          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            // Endposition exakt: gerade (0°), volle Größe, Mitte = E
            envelope.style.transform =
              `translate3d(${(geom.E.x - geom.envW / 2).toFixed(2)}px, ${(geom.E.y - geom.envH / 2).toFixed(2)}px, 0)`;
            envelopeLanded = true;
            resolve();
          }
        }

        setEnvelopeTransform(geom.S.x, geom.S.y, -90 - geom.phi0, ENVELOPE_START_SCALE, geom);
        requestAnimationFrame(frame);
      });
    }

    // Papier-Größe und Weg: Unterkante des Papiers landet bei PAPER_END_BOTTOM der Umschlaghöhe, Oberkante bleibt auf dem Bildschirm
    function layoutEnvelopePaper() {
      const geom = envelopeGeom || computeEnvelopeGeometry();
      const envTop = geom.E.y - geom.envH / 2;
      let pw = geom.envW * 0.88;
      let ratio = inviteRatio > 0 ? Math.min(1.4, Math.max(0.45, inviteRatio)) : 3 / 4;
      let ph = pw / ratio;
      const maxH = envTop + PAPER_END_BOTTOM * geom.envH - geom.vh * 0.06;
      if (ph > maxH) {
        ph = maxH;
        pw = ph * ratio;
      }
      envelope.style.setProperty('--pw', pw + 'px');
      envelope.style.setProperty('--ph', ph + 'px');
      return PAPER_END_BOTTOM * geom.envH - ph - PAPER_START_TOP * geom.envH;   // Verschiebung nach oben (negativ)
    }

    // 4) Lasche klappt nach oben auf, danach gleitet das Papier gleichmäßig heraus; der Umschlag bleibt fix
    async function openEnvelopeAndShowInvitation() {
      await wait(ENVELOPE_OPEN_DELAY_MS);
      const shift = layoutEnvelopePaper();

      await animateEl(
        envFlap,
        'perspective(1100px) rotateX(0deg)',
        'perspective(1100px) rotateX(180deg)',
        ENVELOPE_FLAP_MS,
        'cubic-bezier(0.45, 0.05, 0.3, 1)'
      );
      envFlap.classList.add('open');   // offene Lasche hinter das Papier legen
      await wait(650);                 // offener Umschlag mit der Spitzenkante oben ist kurz zu sehen
      envelope.classList.add('paper-visible');   // Papier erst jetzt einblenden (vorher komplett unsichtbar im Inneren)

      await animateEl(
        envPaper,
        'translateY(0px)',
        `translateY(${shift}px)`,
        ENVELOPE_PAPER_MS,
        'cubic-bezier(0.4, 0, 0.25, 1)'
      );
      window.dispatchEvent(new CustomEvent('invitation-shown'));
    }

    // Sprechblase + Audio, Text synchron zum Audio (mit Satzzeichen-Pausen gewichtet).
    // Gibt erst Ruhe, wenn das Audio zu Ende ist und die fertige Blase kurz stehen geblieben und wieder verschwunden ist.
    function runCatSpeech(audioEl, text, fallbackDurationS, holdMs) {
      return new Promise((resolve) => {
        resetBubblesForNewSequence();

        const len = text.length;
        const cum = [0];
        for (let i = 0; i < len; i++) {
          const ch = text[i];
          let w = ch === ' ' ? 0.6 : 1;
          if (ch === '.' || ch === '!' || ch === '?') w += 5;
          else if (ch === ',') w += 2.5;
          cum.push(cum[i] + w);
        }
        const totalWeight = cum[len];
        const charsForProgress = (prog) => {
          if (prog >= 1) return len;
          const target = prog * totalWeight;
          let lo = 0;
          let hi = len;
          while (lo < hi) {
            const mid = (lo + hi + 1) >> 1;
            if (cum[mid] <= target) lo = mid;
            else hi = mid - 1;
          }
          return lo;
        };

        let useFallback = false;
        let ended = false;
        let shownChars = 0;

        if (audioEl) {
          try { audioEl.currentTime = 0; } catch (err) { /* ignorieren */ }
          audioEl.addEventListener('ended', () => { ended = true; }, { once: true });
          audioEl.addEventListener('error', () => { useFallback = true; }, { once: true });
          const p = audioEl.play();
          if (p && typeof p.catch === 'function') p.catch(() => { useFallback = true; });
        } else {
          useFallback = true;
        }

        const startTime = performance.now();

        function frame() {
          const wall = (performance.now() - startTime) / 1000;
          let duration = fallbackDurationS;
          let t = wall;

          if (!useFallback && audioEl) {
            if (Number.isFinite(audioEl.duration) && audioEl.duration > 1) {
              duration = audioEl.duration;
            }
            if (ended) {
              t = duration;
            } else if (!audioEl.paused && audioEl.currentTime > 0) {
              t = audioEl.currentTime;
            } else {
              t = 0;   // Audio läuft noch nicht: Text wartet
            }
          }

          const done = ended || (useFallback && wall >= duration) || wall > duration + 6;
          const progress = done ? 1 : Math.min(1, t / (duration * MEMORY_INTRO_TEXT_END_RATIO));
          shownChars = Math.max(shownChars, charsForProgress(progress));

          if (shownChars > 0) {
            speechBubble1.textContent = text.slice(0, shownChars);
            speechBubble1.classList.remove('hidden-away');
            speechBubble1.classList.add('visible');
          }

          if (!done) {
            requestAnimationFrame(frame);
          } else {
            speechBubble1.textContent = text;
            window.setTimeout(() => {
              hideBothBubbles();
              resolve();
            }, holdMs);
          }
        }

        requestAnimationFrame(frame);
      });
    }

    async function runMemoryFinale() {
      if (finaleStarted) return;
      finaleStarted = true;

      // Dunklen Hintergrund ausblenden und Katze wieder einblenden (steht hinter den Karten vor dem geschlossenen Vorhang)
      manekiWrap.style.display = '';
      memoryBoard.classList.remove('covered');
      memoryBoard.classList.remove('ready');

      // Karten fallen aufgedeckt und ohne Geräusch aus dem Bild
      await dropAllMemoryCardsAway();
      memoryCells.forEach((c) => { c.el.style.visibility = 'hidden'; });
      memoryBoard.classList.remove('show');

      // Mindestens 1 Sekunde Pause, dann lobt die Katze (audio_4.mp3 + Sprechblase), danach wieder mindestens 1 Sekunde Pause
      await wait(FINALE_BEFORE_AUDIO4_MS);
      await runCatSpeech(catAudio4, FINALE_SPEECH_TEXT, FINALE_SPEECH_FALLBACK_S, FINALE_SPEECH_HOLD_MS);
      await wait(FINALE_AFTER_AUDIO4_MS);

      // Erst jetzt niest die Katze (hatschi.mp3); der Umschlag erscheint im Moment des Niesens
      const usedWebAudio = playSfx('hatschi');
      if (!usedWebAudio) playSfxFallback('hatschi');

      let sneezeMs = HATSCHI_FALLBACK_SNEEZE_MS;
      if (typeof HATSCHI_SNEEZE_OVERRIDE_S === 'number') {
        sneezeMs = HATSCHI_SNEEZE_OVERRIDE_S * 1000;
      } else if (usedWebAudio) {
        sneezeMs = Math.max(0, ((sfxPeak.hatschi || 0) - (sfxLeadIn.hatschi || 0)) * 1000);
      }
      await wait(sneezeMs);

      catSneezeShake();
      await flyEnvelopeSpiral();
      await openEnvelopeAndShowInvitation();
    }

    window.addEventListener('memory-won', () => {
      window.setTimeout(runMemoryFinale, FINALE_START_DELAY_MS);
    });

    // Bei Drehung/Größenänderung des Fensters die Endposition des gelandeten Umschlags neu berechnen
    window.addEventListener('resize', () => {
      if (!envelopeLanded) return;
      const geom = computeEnvelopeGeometry();
      envelopeGeom = geom;
      applyEnvelopeSize(geom);
      envelope.style.transform =
        `translate3d(${(geom.E.x - geom.envW / 2).toFixed(2)}px, ${(geom.E.y - geom.envH / 2).toFixed(2)}px, 0)`;
    });

    // --- Winkekatze: GIF-Prüfung mit automatischem Fallback auf freigestelltes winkekatze.jpg + Arm-Animation ---
    function removeWhiteBackground(sourceImg) {
      const w = sourceImg.naturalWidth || 800;
      const h = sourceImg.naturalHeight || 800;
      const off = document.createElement('canvas');
      off.width = w;
      off.height = h;
      const ctx = off.getContext('2d');
      ctx.drawImage(sourceImg, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const visited = new Uint8Array(w * h);
      const queue = new Int32Array(w * h);
      let head = 0;
      let tail = 0;

      const isNearWhite = (idx) => {
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];
        return r > 236 && g > 236 && b > 236;
      };

      const enqueue = (x, y) => {
        if (x < 0 || x >= w || y < 0 || y >= h) return;
        const p = y * w + x;
        if (visited[p]) return;
        visited[p] = 1;
        if (isNearWhite(p * 4)) {
          queue[tail++] = p;
        }
      };

      for (let x = 0; x < w; x++) {
        enqueue(x, 0);
        enqueue(x, h - 1);
      }
      for (let y = 0; y < h; y++) {
        enqueue(0, y);
        enqueue(w - 1, y);
      }

      while (head < tail) {
        const p = queue[head++];
        const x = p % w;
        const y = (p - x) / w;
        data[p * 4 + 3] = 0;

        enqueue(x + 1, y);
        enqueue(x - 1, y);
        enqueue(x, y + 1);
        enqueue(x, y - 1);
      }

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const p = y * w + x;
          const idx = p * 4;
          if (data[idx + 3] === 0) continue;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          if (r > 218 && g > 218 && b > 218) {
            const hasTransparentNeighbor =
              data[(p - 1) * 4 + 3] === 0 ||
              data[(p + 1) * 4 + 3] === 0 ||
              data[(p - w) * 4 + 3] === 0 ||
              data[(p + w) * 4 + 3] === 0;
            if (hasTransparentNeighbor) {
              const lum = (r + g + b) / 3;
              const alphaFactor = Math.max(0, Math.min(1, (252 - lum) / 34));
              data[idx + 3] = Math.round(255 * alphaFactor);
            }
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return off;
    }

    function startCanvasWavingAnimation(cutoutCanvas) {
      const w = cutoutCanvas.width;
      const h = cutoutCanvas.height;

      const bodyCanvas = document.createElement('canvas');
      bodyCanvas.width = w;
      bodyCanvas.height = h;
      const bCtx = bodyCanvas.getContext('2d');
      bCtx.drawImage(cutoutCanvas, 0, 0);
      bCtx.save();
      bCtx.globalCompositeOperation = 'destination-out';
      bCtx.beginPath();
      bCtx.moveTo(w * 0.675, h * 0.42);
      bCtx.quadraticCurveTo(w * 0.68, h * 0.16, w * 0.88, h * 0.16);
      bCtx.lineTo(w * 0.96, h * 0.56);
      bCtx.quadraticCurveTo(w * 0.76, h * 0.57, w * 0.675, h * 0.48);
      bCtx.closePath();
      bCtx.fill();
      bCtx.restore();

      const armCanvas = document.createElement('canvas');
      armCanvas.width = w;
      armCanvas.height = h;
      const aCtx = armCanvas.getContext('2d');
      aCtx.save();
      aCtx.beginPath();
      aCtx.moveTo(w * 0.665, h * 0.43);
      aCtx.quadraticCurveTo(w * 0.68, h * 0.16, w * 0.88, h * 0.16);
      aCtx.lineTo(w * 0.96, h * 0.56);
      aCtx.quadraticCurveTo(w * 0.74, h * 0.58, w * 0.665, h * 0.48);
      aCtx.closePath();
      aCtx.clip();
      aCtx.drawImage(cutoutCanvas, 0, 0);
      aCtx.restore();

      manekiCanvas.width = w;
      manekiCanvas.height = h;
      const ctx = manekiCanvas.getContext('2d');

      const pivotX = w * 0.735;
      const pivotY = h * 0.465;

      function renderFrame(now) {
        const t = now * 0.0044;
        const waveWave = Math.sin(t);
        const angle = waveWave * 0.14 - 0.03;
        const scaleY = 1 - Math.max(0, waveWave) * 0.14;
        const offsetY = Math.max(0, waveWave) * (h * 0.022);

        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(bodyCanvas, 0, 0);

        ctx.save();
        ctx.translate(pivotX, pivotY + offsetY);
        ctx.rotate(angle);
        ctx.scale(1, scaleY);
        ctx.translate(-pivotX, -pivotY);
        ctx.drawImage(armCanvas, 0, 0);
        ctx.restore();

        requestAnimationFrame(renderFrame);
      }

      requestAnimationFrame(renderFrame);
    }

    function initManekiNeko() {
      const gifProbe = new Image();
      gifProbe.onload = () => {
        manekiCanvas.remove();
        const gifImg = document.createElement('img');
        gifImg.src = MANEKI_CONFIG.gifSrc;
        gifImg.alt = 'Winkende Glückskatze';
        gifImg.className = 'maneki-gif';
        manekiWrap.appendChild(gifImg);
      };
      gifProbe.onerror = () => {
        const jpgImg = new Image();
        jpgImg.onload = () => {
          try {
            const cutout = removeWhiteBackground(jpgImg);
            startCanvasWavingAnimation(cutout);
          } catch (err) {
            // Z. B. beim lokalen Öffnen per file:// blockiert der Browser das Auslesen der Pixel.
            // Dann wird das Bild unverändert (ohne Freistellung/Wink-Animation) angezeigt.
            manekiCanvas.width = jpgImg.naturalWidth || 800;
            manekiCanvas.height = jpgImg.naturalHeight || 800;
            manekiCanvas.getContext('2d').drawImage(jpgImg, 0, 0);
          }
        };
        jpgImg.src = MANEKI_CONFIG.jpgSrc;
      };
      gifProbe.src = MANEKI_CONFIG.gifSrc;
    }

    buildLanterns();
    applyLightLevel(0);
    initManekiNeko();
    // Spielfeld schon jetzt unsichtbar aufbauen, damit bild1.jpg bis bild6.jpg im Hintergrund vorgeladen werden
    buildMemoryBoard();
    // Soundeffekte schon jetzt vorladen und dekodieren (Wiedergabe wird erst im Start-Klick freigeschaltet)
    initSfx();
    // einladung.jpg vorladen (Platzhalter bleibt, bis das Bild da ist)
    initEnvelope();

    window.addEventListener('DOMContentLoaded', () => {
      window.setTimeout(() => {
        button.classList.add('visible');
        volumeHint.classList.add('visible');
      }, 3000);
    });

    button.addEventListener('click', () => {
      if (started) return;
      started = true;
      stage.classList.add('leaving');
      button.disabled = true;

      // Audio direkt im Klick freischalten (wichtig für iOS/Safari)
      unlockAudio(catAudio1);
      unlockAudio(catAudio2);
      unlockAudio(catAudio3);
      unlockAudio(catAudio4);
      unlockSfx();   // Web Audio starten + Notlösungs-Audios freischalten (knall, richtig, falsch, hatschi)

      window.setTimeout(() => {
        stage.classList.add('hidden');
        // 1. Vorhang zuerst einblenden (geschlossen, deckt alles ab)
        curtainContainer.classList.add('visible');

        // 2. Erst wenn der Vorhang deckend ist: Hintergrundbild + Katze einblenden (liegen hinter dem Vorhang)
        window.setTimeout(() => {
          invitationStage.classList.add('ready');
          applyLightLevel(0);

          // 3. Vorhang öffnen; dahinter sind Hintergrundbild und Katze sichtbar
          window.setTimeout(() => {
            curtainContainer.classList.add('open');
            interactive = true;

            // Nach dem Öffnen 1 Sekunde warten, bevor audio_1.mp3 und die Sprechblasen starten
            window.setTimeout(startPhase1AudioAndDialogue, PHASE1_TIMELINE.startDelay * 1000);
          }, 600);
        }, 700);
      }, 1680);
    });
  </script>
</body>
