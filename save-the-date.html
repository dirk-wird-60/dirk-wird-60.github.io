<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ec">
<title>Meine Sechziger starten jetzt</title>
<!-- Google Font für die geschwungene Handschrift-Optik -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
  :root {
    --cream: #f6f4ec;
    --gold-dark: #704816;
    --gold: #b58a3d;
    --gold-light: #f2df9c;
    --ink: #56380f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--cream); }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.7), transparent 68%),
      var(--cream);
  }
  .stage {
    width: min(100%, 540px);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .emblem {
    width: 100%;
    max-height: 76svh;
    overflow: visible;
  }
  .ring {
    fill: none;
    stroke: url(#goldStroke);
    stroke-linecap: round;
    stroke-linejoin: round;
    transform-box: view-box;
    transform-origin: 500px 500px;
    stroke-dasharray: 3000;
    stroke-dashoffset: 3000;
    animation: draw-ring 1.7s cubic-bezier(.22,.7,.2,1) forwards;
  }
  .ring.outer { stroke-width: 10; animation-delay: .08s; }
  .ring.outer-highlight { stroke-width: 2.5; animation-delay: .18s; }
  .ring.inner { stroke-width: 5.5; animation-delay: .42s; }
  .ring.inner-highlight { stroke-width: 2.2; animation-delay: .56s; }
  
  /* Wortweise Animation für das Erscheinen */
  .text-line {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: text-arrive .65s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .line-1 { animation-delay: .95s; }
  .line-2 { animation-delay: 1.15s; }
  .line-3 { animation-delay: 1.36s; }
  .line-4 { animation-delay: 1.57s; }

  .start-button {
    appearance: none;
    border: 1px solid #8d672b;
    border-radius: 999px;
    margin-top: clamp(8px, 2.6vh, 22px);
    min-height: 54px;
    width: min(82%, 320px);
    padding: 14px 28px;
    color: #fffdf6;
    background: linear-gradient(130deg, #7b541c 0%, #c09a4c 48%, #8c6326 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 4px 12px rgba(105,76,29,.18);
    font: 600 1.08rem/1.2 Georgia, "Times New Roman", serif;
    letter-spacing: .035em;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity .5s ease, transform .5s ease, visibility .5s;
  }
  .start-button.visible { opacity: 1; visibility: visible; transform: translateY(0); }

  /* Elegantes Design für die Schüttel-Aufforderung (OHNE Emoji) */
  .shake-callout {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    opacity: 0;
    visibility: hidden;
    text-align: center;
    font: 600 1.6rem/1.3 Georgia, "Times New Roman", serif;
    color: var(--gold-dark);
    padding: 18px 32px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(246, 244, 236, 0.7));
    border: 1px solid #c09a4c;
    box-shadow: 0 8px 24px rgba(112, 72, 22, 0.15);
    transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
    pointer-events: none;
  }
  .shake-callout.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
  }
  .shake-callout.hide {
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -60%) scale(0.95);
  }

  /* --- STYLING FÜR DIE SAVE THE DATE AUFLÖSUNG (MUSTER NACHGEBAUT) --- */
  .card-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    width: min(92%, 460px);
    background-color: #e3ebd9; /* Zarter Grün-Creme-Ton aus der Vorlage */
    padding: 35px 25px 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.2,.8,.2,1), visibility 0.8s;
  }
  .card-container.reveal {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
  }

  .save-title {
    font-family: 'Patrick Hand', 'Caveat', cursive;
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    color: #e5ac24;
    text-shadow: 2px 2px 0px #ab7710, -1px -1px 0px #ab7710;
    letter-spacing: 4px;
    margin: 0 0 20px 0;
    text-transform: uppercase;
  }

  .date-banner {
    background-color: #6d5518; /* Dunkler Braungold-Balken */
    border-radius: 6px;
    padding: 10px 15px;
    margin: 0 auto 25px auto;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.2);
  }

  .date-text {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    color: #f7d24a;
    letter-spacing: 6px;
    margin: 0;
    line-height: 1;
  }

  .info-text-1 {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.8rem, 6.5vw, 2.4rem);
    color: #8c6818;
    margin: 0 0 10px 0;
  }

  .info-text-2 {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.7rem, 6vw, 2.2rem);
    color: #8c6818;
    margin: 0;
  }

  .smiley {
    display: inline-block;
    background-color: #f8db43;
    color: #5c4308;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    line-height: 27px;
    font-size: 18px;
    font-family: sans-serif;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* Klick-Animationen */
  .leaving .ring.outer { animation: ring-out 0.9s ease-in forwards; }
  .leaving .ring.outer-highlight { animation: ring-out-reverse 0.8s ease-in forwards; }
  .leaving .ring.inner { animation: ring-out-reverse 0.85s ease-in forwards; }
  .leaving .ring.inner-highlight { animation: ring-out 0.95s ease-in forwards; }
  
  .leaving .line-1 { animation: text-out 0.45s ease-in 0.90s forwards; }
  .leaving .line-2 { animation: text-out 0.45s ease-in 1.02s forwards; }
  .leaving .line-3 { animation: text-out 0.45s ease-in 1.14s forwards; }
  .leaving .line-4 { animation: text-out 0.45s ease-in 1.26s forwards; }

  .leaving .start-button { opacity: 0; transform: translateY(10px) scale(.97); pointer-events: none; transition: opacity 0.3s ease; }

  @keyframes draw-ring { to { stroke-dashoffset: 0; } }
  @keyframes text-arrive {
    from { opacity: 0; transform: translateY(18px) scale(.94); filter: blur(3px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes ring-out {
    to { opacity: 0; transform: rotate(24deg) scale(1.08); stroke-dashoffset: -3000; }
  }
  @keyframes ring-out-reverse {
    to { opacity: 0; transform: rotate(-28deg) scale(.9); stroke-dashoffset: 3000; }
  }
  @keyframes text-out {
    to { opacity: 0; transform: translateY(-20px) scale(.88); filter: blur(4px); }
  }
  @media (max-height: 650px) {
    .emblem { max-height: 68svh; }
    .start-button { min-height: 48px; margin-top: 8px; }
  }
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Meine Sechziger starten jetzt">
  <svg class="emblem" viewBox="0 0 1000 1000" role="img" aria-labelledby="title description">
    <title id="title">Meine Sechziger starten jetzt</title>
    <desc id="description">Goldene Schrift innerhalb mehrerer feiner, kreisförmiger Goldlinien auf cremefarbenem Hintergrund.</desc>
    <defs>
      <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff0a8"/>
        <stop offset=".17" stop-color="#a87522"/>
        <stop offset=".3" stop-color="#f9e6a0"/>
        <stop offset=".47" stop-color="#8a5b18"/>
        <stop offset=".62" stop-color="#e4c36b"/>
        <stop offset=".79" stop-color="#9b6b21"/>
        <stop offset="1" stop-color="#f5df91"/>
      </linearGradient>

      <!-- Perfekt eingepasste Ausschnitt-Masken -->
      <clipPath id="clip-line1"><rect x="250" y="220" width="500" height="140" /></clipPath>
      <clipPath id="clip-line2"><rect x="80" y="350" width="840" height="140" /></clipPath>
      <clipPath id="clip-line3"><rect x="280" y="480" width="640" height="140" /></clipPath>
      <clipPath id="clip-line4"><rect x="180" y="610" width="640" height="140" /></clipPath>
    </defs>

    <!-- Einzelne animierte Ringbahnen -->
    <circle class="ring outer" cx="500" cy="500" r="414"/>
    <circle class="ring outer-highlight" cx="500" cy="500" r="426"
      stroke-dasharray="2450 230" stroke-dashoffset="95"/>
    <circle class="ring inner" cx="500" cy="500" r="382"
      stroke-dasharray="2210 190" stroke-dashoffset="65"/>
    <circle class="ring inner-highlight" cx="500" cy="500" r="370"
      stroke-dasharray="2150 175" stroke-dashoffset="150"/>

    <!-- Perfekt skalierter und eingepasster PNG-Schriftzug -->
    <image class="text-line line-1" href="Schriftzug.png" x="160" y="180" width="680" height="600" clip-path="url(#clip-line1)" preserveAspectRatio="xMidYMid meet" />
    <image class="text-line line-2" href="Schriftzug.png" x="160" y="180" width="680" height="600" clip-path="url(#clip-line2)" preserveAspectRatio="xMidYMid meet" />
    <image class="text-line line-3" href="Schriftzug.png" x="160" y="180" width="680" height="600" clip-path="url(#clip-line3)" preserveAspectRatio="xMidYMid meet" />
    <image class="text-line line-4" href="Schriftzug.png" x="160" y="180" width="680" height="600" clip-path="url(#clip-line4)" preserveAspectRatio="xMidYMid meet" />
  </svg>

  <!-- Aufruf ohne Emoji -->
  <div class="shake-callout" id="shakeCallout">Schüttle dein Handy!</div>

  <!-- Karte als Endergebnis (Save the Date) -->
  <div class="card-container" id="cardContainer">
    <h1 class="save-title">SAVE THE DATE</h1>
    <div class="date-banner">
      <p class="date-text">27.02.2027</p>
    </div>
    <p class="info-text-1">Weitere Infos folgen!</p>
    <p class="info-text-2">Ich freue mich auf Euch <span class="smiley">🙂</span></p>
  </div>

  <button class="start-button" id="startButton" type="button">Los geht's</button>
</main>

<script>
  const stage = document.getElementById('stage');
  const button = document.getElementById('startButton');
  const shakeCallout = document.getElementById('shakeCallout');
  const cardContainer = document.getElementById('cardContainer');

  let started = false;
  let shakeHandled = false;
  let lastX = 0, lastY = 0, lastZ = 0;
  let lastTime = 0;
  const SHAKE_THRESHOLD = 12;

  window.addEventListener('DOMContentLoaded', () => {
    window.setTimeout(() => button.classList.add('visible'), 3000);
  });

  button.addEventListener('click', () => {
    if (started) return;
    started = true;

    // Sensorfreigabe anfragen
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
            startTracking();
          }
        })
        .catch(() => {});
    } else {
      startTracking();
    }

    // Abbau-Animation starten
    stage.classList.add('leaving');
    button.disabled = true;

    // Aufruf "Schüttle dein Handy!" einblenden
    window.setTimeout(() => {
      if (!shakeHandled) {
        shakeCallout.classList.add('show');
      }
    }, 1800);
  });

  function startTracking() {
    window.addEventListener('devicemotion', handleMotion);
  }

  // PC-Testing: Leertaste drückt "Schütteln" aus
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && started && !shakeHandled) {
      triggerShakeAction();
    }
  });

  function handleMotion(event) {
    if (shakeHandled) return;

    let acc = event.acceleration;
    if (!acc || acc.x === null) {
      acc = event.accelerationIncludingGravity;
    }
    if (!acc || acc.x === null) return;

    let currentTime = Date.now();
    if ((currentTime - lastTime) > 100) {
      let deltaX = Math.abs(acc.x - lastX);
      let deltaY = Math.abs(acc.y - lastY);
      let deltaZ = Math.abs(acc.z - lastZ);

      if ((deltaX > SHAKE_THRESHOLD && deltaY > SHAKE_THRESHOLD) ||
          (deltaX > SHAKE_THRESHOLD && deltaZ > SHAKE_THRESHOLD) ||
          (deltaY > SHAKE_THRESHOLD && deltaZ > SHAKE_THRESHOLD)) {
        
        triggerShakeAction();
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
      lastTime = currentTime;
    }
  }

  function triggerShakeAction() {
    if (shakeHandled) return;
    shakeHandled = true;

    // 1. Schüttel-Aufruf ausblenden
    shakeCallout.classList.remove('show');
    shakeCallout.classList.add('hide');

    // 2. Event-Listener entfernen
    window.removeEventListener('devicemotion', handleMotion);

    // 3. Save the Date Karte einblenden
    window.setTimeout(() => {
      cardContainer.classList.add('reveal');
    }, 400);
  }
</script>
</body>
</html>
