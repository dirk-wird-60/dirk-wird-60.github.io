<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy Schüttel-Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 50px 20px;
            transition: background 0.3s ease;
            user-select: none;
        }
        #actionBtn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            background-color: #28a745; /* Grüner Button */
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #actionBtn:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 30px;
            font-weight: bold;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Schüttle dein Handy!</h1>
    <p>Klicke auf den Button, um den Schüttel-Modus zu starten.</p>
    
    <!-- Der Button ist jetzt dauerhaft da -->
    <button id="actionBtn">Los geht's!</button>
    <div id="status">Status: Wartet auf Start...</div>

    <script>
        const actionBtn = document.getElementById('actionBtn');
        const statusDiv = document.getElementById('status');
        
        let lastX = 0, lastY = 0, lastZ = 0;
        let lastTime = 0;
        const SHAKE_THRESHOLD = 12; // Empfindlichkeit beim Schütteln

        // Klick-Event für den Button
        actionBtn.addEventListener('click', () => {
            // Prüfen, ob es ein iPhone/iOS ist, das eine Erlaubnis verlangt
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startTracking();
                        } else {
                            statusDiv.innerText = "Zugriff auf Sensoren verweigert.";
                        }
                    })
                    .catch(err => {
                        statusDiv.innerText = "Fehler: " + err;
                    });
            } else {
                // Für Android und Desktop-Browser direkt starten
                startTracking();
            }
        });

        function startTracking() {
            window.addEventListener('devicemotion', handleMotion);
            statusDiv.innerText = "Bereit! Schüttle jetzt dein Handy. 🎉";
            actionBtn.style.display = 'none'; // Blendet den Button nach dem Klick aus
        }

        function handleMotion(event) {
            // Nutzen der reinen Beschleunigung ohne Schwerkraft gegen das Dauerschütteln
            let acc = event.acceleration; 
            
            // Fallback für ältere Browser/Systeme
            if (!acc || acc.x === null) {
                acc = event.accelerationIncludingGravity;
            }

            if (!acc || acc.x === null) return;

            let currentTime = Date.now();
            if ((currentTime - lastTime) > 100) { 
                let diffTime = currentTime - lastTime;
                lastTime = currentTime;

                // Bewegungsänderung berechnen
                let deltaX = Math.abs(acc.x - lastX);
                let deltaY = Math.abs(acc.y - lastY);
                let deltaZ = Math.abs(acc.z - lastZ);

                // Schütteln wird nur erkannt, wenn sich mindestens zwei Achsen stark bewegen
                if ((deltaX > SHAKE_THRESHOLD && deltaY > SHAKE_THRESHOLD) || 
                    (deltaX > SHAKE_THRESHOLD && deltaZ > SHAKE_THRESHOLD) || 
                    (deltaY > SHAKE_THRESHOLD && deltaZ > SHAKE_THRESHOLD)) {
                    
                    triggerShakeAction();
                }

                lastX = acc.x;
                lastY = acc.y;
                lastZ = acc.z;
            }
        }

        function triggerShakeAction() {
            statusDiv.innerText = "Schütteln erkannt! 🚀";
            
            // Ändert die Hintergrundfarbe zufällig
            const randomColor = Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = "#" + randomColor;

            // Nach 800 Millisekunden Text wieder zurücksetzen
            setTimeout(() => {
                statusDiv.innerText = "Bereit für das nächste Schütteln...";
            }, 800);
        }
    </script>
</body>
</html>
